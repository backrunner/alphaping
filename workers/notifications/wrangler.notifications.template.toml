name = "alphaping-notifications-template"
main = "src/index.ts"
compatibility_date = "2026-07-15"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "alphaping-control-template"
database_id = "00000000-0000-0000-0000-000000000000"

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "alphaping-telemetry-template"
database_id = "00000000-0000-0000-0000-000000000000"

[env.production]
name = "alphaping-notifications-production"
workers_dev = false
preview_urls = false

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.d1_databases]]
binding = "CONTROL_DB"
database_name = "alphaping-control-template"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.production.d1_databases]]
binding = "TELEMETRY_DB"
database_name = "alphaping-telemetry-template"
database_id = "00000000-0000-0000-0000-000000000000"
