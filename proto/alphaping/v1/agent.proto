syntax = "proto3";

package alphaping.v1;

message EnvelopeHeader {
  uint32 protocol_version = 1;
  bytes agent_id = 2;
  uint32 key_epoch = 3;
  uint64 sequence = 4;
  int64 sent_at_ms = 5;
  bytes report_id = 6;
}

message EncryptedEnvelope {
  EnvelopeHeader header = 1;
  bytes ciphertext = 2;
}

message MetricSample {
  int64 observed_at_ms = 1;
  uint32 cpu_permille = 2;
  uint64 memory_used_bytes = 3;
  uint64 memory_total_bytes = 4;
  uint64 storage_used_bytes = 5;
  uint64 storage_total_bytes = 6;
  uint64 network_rx_bytes_per_second = 7;
  uint64 network_tx_bytes_per_second = 8;
  uint64 network_rx_bytes_total = 9;
  uint64 network_tx_bytes_total = 10;
}

message MachineReport {
  bytes report_id = 1;
  uint64 machine_pk = 2;
  uint64 workspace_pk = 3;
  int64 nominal_minute_ms = 4;
  repeated MetricSample samples = 5;
  uint32 schema_version = 6;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_COMMITTED = 1;
  ACK_STATUS_DUPLICATE = 2;
}

message DurableAck {
  bytes report_id = 1;
  AckStatus status = 2;
  int64 committed_at_ms = 3;
  uint64 config_revision = 4;
}
