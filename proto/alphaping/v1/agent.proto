syntax = "proto3";

package alphaping.v1;

message EnvelopeHeader {
  uint32 protocol_version = 1;
  bytes agent_id = 2;
  uint32 key_epoch = 3;
  uint64 sequence = 4;
  int64 sent_at_ms = 5;
  bytes report_id = 6;
}

message EncryptedEnvelope {
  EnvelopeHeader header = 1;
  bytes ciphertext = 2;
}

message MetricSample {
  int64 observed_at_ms = 1;
  uint32 cpu_permille = 2;
  uint64 memory_used_bytes = 3;
  uint64 memory_total_bytes = 4;
  uint64 storage_used_bytes = 5;
  uint64 storage_total_bytes = 6;
  uint64 network_rx_bytes_per_second = 7;
  uint64 network_tx_bytes_per_second = 8;
  uint64 network_rx_bytes_total = 9;
  uint64 network_tx_bytes_total = 10;
}

enum ContainerRuntimeKind {
  CONTAINER_RUNTIME_KIND_UNSPECIFIED = 0;
  CONTAINER_RUNTIME_KIND_DOCKER = 1;
  CONTAINER_RUNTIME_KIND_COLIMA_DOCKER = 2;
  CONTAINER_RUNTIME_KIND_COLIMA_CONTAINERD = 3;
  CONTAINER_RUNTIME_KIND_APPLE_CONTAINER = 4;
}

enum RuntimeAvailability {
  RUNTIME_AVAILABILITY_UNSPECIFIED = 0;
  RUNTIME_AVAILABILITY_AVAILABLE = 1;
  RUNTIME_AVAILABILITY_ABSENT = 2;
  RUNTIME_AVAILABILITY_STOPPED = 3;
  RUNTIME_AVAILABILITY_PERMISSION_DENIED = 4;
  RUNTIME_AVAILABILITY_INCOMPATIBLE = 5;
  RUNTIME_AVAILABILITY_ERROR = 6;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_PAUSED = 3;
  CONTAINER_STATE_RESTARTING = 4;
  CONTAINER_STATE_EXITED = 5;
  CONTAINER_STATE_DEAD = 6;
  CONTAINER_STATE_UNKNOWN = 7;
}

enum ContainerHealth {
  CONTAINER_HEALTH_UNSPECIFIED = 0;
  CONTAINER_HEALTH_NONE = 1;
  CONTAINER_HEALTH_STARTING = 2;
  CONTAINER_HEALTH_HEALTHY = 3;
  CONTAINER_HEALTH_UNHEALTHY = 4;
  CONTAINER_HEALTH_UNKNOWN = 5;
}

message RuntimeSnapshot {
  ContainerRuntimeKind kind = 1;
  string instance = 2;
  RuntimeAvailability availability = 3;
  string version = 4;
  string detail_code = 5;
}

message ContainerPort {
  uint32 private_port = 1;
  uint32 public_port = 2;
  string protocol = 3;
  string host_ip = 4;
}

message ContainerCatalogEntry {
  bytes container_key = 1;
  ContainerRuntimeKind runtime = 2;
  string runtime_instance = 3;
  string runtime_container_id = 4;
  string name = 5;
  string image = 6;
}

message ContainerMetric {
  bytes container_key = 1;
  ContainerState state = 2;
  ContainerHealth health = 3;
  int64 started_at_ms = 4;
  uint32 restart_count = 5;
  uint32 cpu_permille = 6;
  uint64 memory_used_bytes = 7;
  uint64 memory_limit_bytes = 8;
  uint64 network_rx_bytes_per_second = 9;
  uint64 network_tx_bytes_per_second = 10;
  uint64 network_rx_bytes_total = 11;
  uint64 network_tx_bytes_total = 12;
  repeated ContainerPort ports = 13;
  int32 exit_code = 14;
}

message ContainerInventory {
  int64 observed_at_ms = 1;
  bytes catalog_digest = 2;
  repeated RuntimeSnapshot runtimes = 3;
  repeated ContainerCatalogEntry catalog = 4;
  repeated ContainerMetric metrics = 5;
  bool catalog_included = 6;
}

message MachineReport {
  bytes report_id = 1;
  uint64 machine_pk = 2;
  uint64 workspace_pk = 3;
  int64 nominal_minute_ms = 4;
  repeated MetricSample samples = 5;
  uint32 schema_version = 6;
  ContainerInventory container_inventory = 7;
  repeated ProbeResult probe_results = 8;
  uint64 applied_config_revision = 9;
  repeated AgentCommandResult command_results = 10;
  string agent_version = 11;
}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_HTTP = 1;
  PROBE_KIND_TCP = 2;
  PROBE_KIND_ICMP = 3;
}

enum ProbeState {
  PROBE_STATE_UNSPECIFIED = 0;
  PROBE_STATE_HEALTHY = 1;
  PROBE_STATE_DEGRADED = 2;
  PROBE_STATE_DOWN = 3;
}

message ProbeHeader {
  string name = 1;
  string value = 2;
  bool sensitive = 3;
}

message ProbeAssertion {
  string source = 1;
  string operator = 2;
  string selector = 3;
  bytes expected_json = 4;
  string severity = 5;
}

message HttpProbeRequest {
  string url = 1;
  string method = 2;
  repeated ProbeHeader headers = 3;
  bytes body = 4;
  repeated uint32 expected_status = 5;
  uint32 degraded_after_ms = 6;
  uint32 down_after_ms = 7;
  uint32 max_redirects = 8;
  uint32 max_response_bytes = 9;
  repeated ProbeAssertion assertions = 10;
}

message TcpProbeRequest {
  string hostname = 1;
  uint32 port = 2;
  bool use_tls = 3;
  bytes payload = 4;
  bytes response_prefix = 5;
}

message IcmpProbeRequest {
  string hostname = 1;
  uint32 degraded_after_ms = 2;
  uint32 down_after_ms = 3;
}

message ProbeTask {
  string check_id = 1;
  uint64 check_pk = 2;
  uint64 service_pk = 3;
  uint64 workspace_pk = 4;
  uint64 config_revision = 5;
  ProbeKind kind = 6;
  uint32 interval_seconds = 7;
  uint32 phase_seconds = 8;
  uint32 timeout_ms = 9;
  oneof request {
    HttpProbeRequest http = 10;
    TcpProbeRequest tcp = 11;
    IcmpProbeRequest icmp = 12;
  }
}

message AgentConfigSnapshot {
  uint64 revision = 1;
  repeated ProbeTask probe_tasks = 2;
  int64 created_at_ms = 3;
  bytes digest = 4;
}

enum AgentCommandType {
  AGENT_COMMAND_TYPE_UNSPECIFIED = 0;
  AGENT_COMMAND_TYPE_REFRESH_CONFIG = 1;
  AGENT_COMMAND_TYPE_CHECK_UPDATE = 2;
  AGENT_COMMAND_TYPE_INSTALL_VERSION = 3;
  AGENT_COMMAND_TYPE_REDETECT_RUNTIMES = 4;
}

message AgentCommand {
  string id = 1;
  AgentCommandType type = 2;
  int64 not_before_ms = 3;
  int64 expires_at_ms = 4;
  uint32 attempt_limit = 5;
  uint32 payload_schema_version = 6;
  string requested_version = 7;
  bool bypass_rollout = 8;
}

enum AgentCommandResultStatus {
  AGENT_COMMAND_RESULT_STATUS_UNSPECIFIED = 0;
  AGENT_COMMAND_RESULT_STATUS_SUCCEEDED = 1;
  AGENT_COMMAND_RESULT_STATUS_FAILED = 2;
}

message AgentCommandResult {
  string command_id = 1;
  AgentCommandResultStatus status = 2;
  int64 completed_at_ms = 3;
  string result_code = 4;
  string installed_version = 5;
}

message ProbeResult {
  bytes execution_id = 1;
  string check_id = 2;
  uint64 check_pk = 3;
  uint64 service_pk = 4;
  uint64 workspace_pk = 5;
  string executor_agent_id = 6;
  uint64 config_revision = 7;
  int64 nominal_slot_ms = 8;
  int64 observed_at_ms = 9;
  ProbeState state = 10;
  optional uint32 latency_ms = 11;
  string failure_code = 12;
  string failure_summary = 13;
}

message EnrollmentRequest {
  bytes token = 1;
  bytes identity_public_key = 2;
  string platform = 3;
  string arch = 4;
  string agent_version = 5;
  uint32 protocol_version = 6;
  string machine_claim_id = 7;
  bytes request_nonce = 8;
  repeated uint32 supported_protocol_versions = 9;
  bool pq_hybrid = 10;
  bytes signature = 11;
}

message EnrollmentResponse {
  string agent_id = 1;
  uint64 machine_pk = 2;
  uint64 workspace_pk = 3;
  uint32 key_epoch = 4;
  bytes data_key = 5;
  bytes nonce_prefix = 6;
  uint64 config_revision = 7;
  uint32 sample_interval_seconds = 8;
  uint32 report_interval_seconds = 9;
  uint64 server_time_ms = 10;
  uint32 max_clock_skew_ms = 11;
  uint32 max_envelope_bytes = 12;
  uint64 initial_client_sequence = 13;
  uint64 initial_server_sequence = 14;
  string machine_claim_id = 15;
  bool container_monitoring_enabled = 16;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_COMMITTED = 1;
  ACK_STATUS_DUPLICATE = 2;
}

message DurableAck {
  bytes report_id = 1;
  AckStatus status = 2;
  int64 committed_at_ms = 3;
  uint64 config_revision = 4;
  AgentConfigSnapshot config = 5;
  repeated AgentCommand commands = 6;
  LiveSessionCredential live_session = 7;
}

message LiveSessionCredential {
  string endpoint = 1;
  string ticket = 2;
  bytes session_id = 3;
  bytes session_key = 4;
  bytes nonce_prefix = 5;
  int64 expires_at_ms = 6;
}
