<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <!--
      Anti-FOUC theme bootstrap. This inline script is allowlisted by a sha256
      hash in the CSP script-src directive (svelte.config.js). Any edit to the
      script content — including whitespace — changes the hash and will be
      blocked by CSP until svelte.config.js is updated. Guarded by
      src/theme-bootstrap.test.ts.
    -->
    <script>
      // Anti-FOUC theme bootstrap: apply the stored theme before first paint.
      // "light" | "dark" set data-theme on <html>; anything else means system.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
      } catch {
        // localStorage unavailable; fall back to system preference.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
