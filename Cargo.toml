[workspace]
members = [
  "crates/agent",
  "crates/crypto",
  "crates/protocol",
  "crates/runtime-adapters",
  "workers/ingest",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/alkinum/alphaping"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = "1.10.1"
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.3.3"
hmac = "0.12.1"
hex = "0.4.3"
hkdf = "0.12.4"
jsonpath-rust = "1.0.5"
miniz_oxide = "0.9.1"
prost = "0.14.1"
prost-build = "0.14.1"
protoc-bin-vendored = "3.2.0"
rand = "0.9.1"
regex = "1.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = "1.0.26"
sha2 = "0.10.9"
sysinfo = "0.39.6"
surge-ping = "0.9.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
toml = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
uuid = { version = "1.17.0", features = ["serde", "v7"] }
webpki-roots = "1.0.2"
worker = { version = "0.8.5", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
