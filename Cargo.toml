[workspace]
members = [
  "crates/agent",
  "crates/crypto",
  "crates/protocol",
  "crates/runtime-adapters",
  "workers/ingest",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/BackRunner/alphaping"

[workspace.dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
hex = "0.4.3"
hkdf = "0.13.0"
jsonpath-rust = "1.0.10"
miniz_oxide = "0.9.1"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.44", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
sysinfo = "0.39.6"
surge-ping = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = "0.26.5"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
webpki-roots = "1.0.9"
worker = { version = "0.8.5", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# wasm-bindgen 0.2.128 needs target_features to generate reference-type catch wrappers.
# Keep native Agent stripping, while preserving Wasm custom sections until binding generation.
[profile.release.package.alphaping-ingest]
strip = "debuginfo"
