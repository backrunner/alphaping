name: Agent Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact Agent semantic version already present in Cargo.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$VERSION" = "$CARGO_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binary: target/x86_64-unknown-linux-musl/release/alphaping-agent
          - target: linux-aarch64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary: target/aarch64-unknown-linux-musl/release/alphaping-agent
          - target: macos-x86_64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: target/x86_64-apple-darwin/release/alphaping-agent
          - target: macos-aarch64
            rust_target: aarch64-apple-darwin
            runner: macos-15
            binary: target/aarch64-apple-darwin/release/alphaping-agent
          - target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: target/x86_64-pc-windows-msvc/release/alphaping-agent.exe
          - target: windows-aarch64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: target/aarch64-pc-windows-msvc/release/alphaping-agent.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: agent-release-${{ matrix.rust_target }}
      - name: Validate public update root
        shell: bash
        env:
          ALPHAPING_UPDATE_ROOT_JSON: ${{ vars.ALPHAPING_UPDATE_ROOT_JSON }}
        run: |
          test -n "$ALPHAPING_UPDATE_ROOT_JSON"
          node -e 'JSON.parse(process.env.ALPHAPING_UPDATE_ROOT_JSON)'
      - name: Install static Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Agent
        shell: bash
        env:
          ALPHAPING_UPDATE_ROOT_JSON: ${{ vars.ALPHAPING_UPDATE_ROOT_JSON }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export CC=musl-gcc
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          cargo build --locked --release -p alphaping-agent --target ${{ matrix.rust_target }}
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            readelf -l "${{ matrix.binary }}" > agent-program-headers.txt
            if grep -q INTERP agent-program-headers.txt; then
              echo "Agent unexpectedly requires a dynamic loader" >&2
              exit 1
            fi
          fi
      - name: Package and verify Agent
        shell: bash
        run: >-
          node scripts/release/package-agent.mjs
          --binary "${{ matrix.binary }}"
          --target "${{ matrix.target }}"
          --version "${{ needs.prepare.outputs.version }}"
          --source-commit "$GITHUB_SHA"
          --source-date-epoch "${{ needs.prepare.outputs.source_date_epoch }}"
          --output "release-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.target }}
          path: release-package/*
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: release-packages
          merge-multiple: true
      - run: >-
          node scripts/release/assemble-release.mjs
          --input release-packages
          --output release-artifacts
          --version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaping-agent-release-${{ needs.prepare.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
